name: detent
description: Windows tray app that switches the system pointer speed between saved levels.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.4
  tray_manager: ^0.8.0
  window_manager: ^0.5.1
  win32: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
